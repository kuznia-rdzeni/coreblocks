name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

jobs:
  build-core:
    strategy:
      fail-fast: false
      matrix:
        config: [full]
        rvvi: [false, true]
    name: Synthesize full core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.13'

      - name: Install Coreblocks dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install .

      - name: Generate Verilog
        env:
          PYTHONHASHSEED: 0
          TRANSACTRON_VERBOSE: 1
        run: |
          . venv/bin/activate
          python3 -m coreblocks.gen_verilog --verbose --config "${{ matrix.config }}" ${{ matrix.rvvi && '--with-rvvi' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: "verilog-${{ matrix.config }}-core${{ matrix.rvvi && '-rvvi' || '' }}"
          path: |
            core.v
            core.v.json

  build-regression-tests:
    name: Build regression tests (riscv-tests)
    runs-on: ubuntu-latest
    container: ghcr.io/kuznia-rdzeni/riscv-toolchain:2024.12.07
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get submodules HEAD hash
        run: |
          git config --global --add safe.directory /__w/coreblocks/coreblocks
          git submodule > .gitmodules-hash

      - name: Cache regression-tests
        id: cache-regression
        uses: actions/cache@v4
        env:
          cache-name: cache-regression-tests
        with:
          path: test/external/riscv-tests/test-*
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ hashFiles(
              '**/test/external/riscv-tests/environment/custom/**',
              '**/test/external/riscv-tests/Makefile',
              '**/.gitmodules-hash',
              '**/docker/riscv-toolchain.Dockerfile',
              '**/.github/workflows/main.yml'
            ) }}
          lookup-only: true

      - if: ${{ steps.cache-regression.outputs.cache-hit != 'true' }}
        name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - if: ${{ steps.cache-regression.outputs.cache-hit != 'true' }}
        run: cd test/external/riscv-tests && make

      - if: ${{ steps.cache-regression.outputs.cache-hit != 'true' }}
        name: Upload riscv-tests
        uses: actions/upload-artifact@v7
        with:
          path: test/external/riscv-tests

  run-regression-tests:
    name: Run regression tests (riscv-tests)
    runs-on: ubuntu-22.04  # older version for compatibility with Docker image
    timeout-minutes: 60
    container: ghcr.io/kuznia-rdzeni/verilator:v5.008-2023.11.19_v
    needs: [ build-regression-tests, build-cxxsim ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get submodules HEAD hash
        run: |
          git config --global --add safe.directory /__w/coreblocks/coreblocks
          git submodule > .gitmodules-hash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install ".[dev]"

      - uses: actions/cache@v4
        name: Download tests from cache
        env:
          cache-name: cache-regression-tests
        with:
          path: test/external/riscv-tests/test-*
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ hashFiles(
              '**/test/external/riscv-tests/environment/custom/**',
              '**/test/external/riscv-tests/Makefile',
              '**/.gitmodules-hash',
              '**/docker/riscv-toolchain.Dockerfile',
              '**/.github/workflows/main.yml'
            ) }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        name: Download the C++ simulator
        with:
          name: cxxsim
          path: test/sim/build

      - name: Run tests
        run: |
          . venv/bin/activate
          scripts/run_tests.py -a -b cxxsim regression -v

      - name: Check regression with pysim
        run: |
          . venv/bin/activate
          ./scripts/run_tests.py -c 1 -a -b pysim regression

  build-arch-regression-tests:
    name: Build arch regression tests (riscv-arch-test)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/riscv/act4-build:sha-15d2c68b1fa14b3e3eefbc1baeed59f05b60cb73
      options: --user root
    timeout-minutes: 20
    steps:
      - name: Add required tools for github CI
        run: |
          apt-get update
          apt-get install -y git tar gzip curl ca-certificates build-essential libgmp-dev

      - name: Checkout
        uses: actions/checkout@v6

      - name: Get submodules HEAD hash
        working-directory: .
        run: |
          git config --global --add safe.directory /__w/coreblocks/coreblocks
          git submodule > .gitmodules-hash

      - name: Cache arch regression tests
        id: cache-arch-regression-tests
        uses: actions/cache@v4
        env:
          cache-name: cache-arch-regression-tests
        with:
          path: |
            test/external/riscv-arch-test/elfs/**/*.elf
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ hashFiles(
              '**/test/external/riscv-arch-test/Makefile',
              '**/test/external/riscv-arch-test/coreblocks/**',
              '**/.gitmodules-hash',
              '**/.github/workflows/main.yml'
            ) }}

      - if: ${{ steps.cache-arch-regression-tests.outputs.cache-hit != 'true' }}
        name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - if: ${{ steps.cache-arch-regression-tests.outputs.cache-hit != 'true' }}
        name: Install mise tools for riscv-arch-test
        working-directory: test/external/riscv-arch-test/riscv-arch-test
        run: |
          mise trust
          mise install

      - if: ${{ steps.cache-arch-regression-tests.outputs.cache-hit != 'true' }}
        name: Build arch regression tests
        run: make -C test/external/riscv-arch-test -j $(nproc)

      - name: Upload riscv-arch-test tests
        uses: actions/upload-artifact@v7
        with:
          name: "riscv-arch-test-elfs"
          path: test/external/riscv-arch-test/elfs

  run-arch-regression-tests:
    strategy:
      fail-fast: false
      matrix:
        config: [cxxsim, pysim]
    name: Run arch regression tests (riscv-arch-test)
    runs-on: ubuntu-22.04  # older version for compatibility with Docker image
    container: ghcr.io/kuznia-rdzeni/verilator:v5.008-2023.11.19_v
    timeout-minutes: 180
    needs: [ build-arch-regression-tests, build-cxxsim ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get submodules HEAD hash
        working-directory: .
        run: |
          git config --global --add safe.directory /__w/coreblocks/coreblocks
          git submodule > .gitmodules-hash

      - name: Restore arch regression tests cache
        uses: actions/cache@v4
        env:
          cache-name: cache-arch-regression-tests
        with:
          path: |
            test/external/riscv-arch-test/elfs/**/*.elf
          key: ${{ env.cache-name }}-${{ runner.os }}-${{ hashFiles(
              '**/test/external/riscv-arch-test/Makefile',
              '**/test/external/riscv-arch-test/coreblocks/**',
              '**/.gitmodules-hash',
              '**/.github/workflows/main.yml'
            ) }}
          fail-on-cache-miss: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install ".[dev]"

      - if: ${{ matrix.config == 'cxxsim' }}
        uses: actions/download-artifact@v8
        name: Download the C++ simulator
        with:
          name: cxxsim
          path: test/sim/build

      - name: Run arch regression tests
        run: |
          . venv/bin/activate
          if [ "${{ matrix.config }}" = "cxxsim" ]; then
            ./scripts/run_tests.py --arch-tests -v -b cxxsim regression
          else
            ./scripts/run_tests.py --arch-tests -v -b pysim -c 1 -j 0 'regression.*not'
          fi

  build-cxxsim:
    name: Build the C++ simulator
    runs-on: ubuntu-22.04  # older version for compatibility with Docker image
    container: ghcr.io/kuznia-rdzeni/verilator:v5.008-2023.11.19_v
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install ".[dev]"

      - name: Build the simulator
        run: |
          . venv/bin/activate
          python3 -m test.sim.cxx_build

      - name: Upload the simulator
        uses: actions/upload-artifact@v7
        with:
          name: cxxsim
          # Everything needed to run, and to convince the build that it is up to date.
          path: |
            test/sim/build/verilog
            test/sim/build/verilog.stamp
            test/sim/build/cxxsim/Vtop__ALL.a
            test/sim/build/cxxsim/*.so
            test/sim/build/cxxsim/*.stamp

  build-embench:
    name: Build performance benchmarks (embench)
    runs-on: ubuntu-latest
    container: ghcr.io/kuznia-rdzeni/riscv-toolchain:2024.12.07
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build embench
        run: cd test/external/embench && make

      - uses: actions/upload-artifact@v7
        with:
          name: "embench"
          path: test/external/embench/build

  run-benchmarks:
    name: Run performance benchmarks
    runs-on: ubuntu-22.04  # older version for compatibility with Docker image
    container: ghcr.io/kuznia-rdzeni/verilator:v5.008-2023.11.19_v
    timeout-minutes: 60
    needs: [ build-cxxsim, build-embench ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install ".[dev]"

      - uses: actions/download-artifact@v8
        with:
          name: "embench"
          path: test/external/embench/build

      - uses: actions/download-artifact@v8
        name: Download the C++ simulator
        with:
          name: cxxsim
          path: test/sim/build

      - name: Run benchmarks
        run: |
          . venv/bin/activate
          ./scripts/run_benchmarks.py -b cxxsim -o cxxsim_benchmark.json --summary cxxsim_benchmark.md
          cat cxxsim_benchmark.md >> $GITHUB_STEP_SUMMARY

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install ".[dev]"
          sudo apt-get install -y binutils-riscv64-unknown-elf

      - name: Run tests
        run: ./scripts/run_tests.py -v

      - name: Check traces and profiles
        run: ./scripts/run_tests.py -t -p -c 1 TestCore

      - name: Check listing tests
        run: ./scripts/run_tests.py -l

  lint:
    name: Check code formatting and typing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip3 install ".[dev]"

      - name: Check format
        run: ./scripts/lint.sh check_format

      - name: Check types
        run: ./scripts/lint.sh check_types

      - name: Check line endings
        run: |
          git add --renormalize .
          git diff --cached --exit-code

      - name: Check pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
