name: Build docs and trigger gh-pages

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  merge_group:
  workflow_dispatch:

jobs:
  push_gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCS_DIR: "docs"
      BUILD_DIR: "build"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install ".[dev]"

      - name: Build documentation
        run: |
          ./ci/build_docs.sh

      - name: Push documentation
        # Deploy documentation only when on master
        if: |
          github.repository == 'kuznia-rdzeni/coreblocks' &&
          github.ref == 'refs/heads/master'
        run: |
          ./ci/push_gh_pages.sh
